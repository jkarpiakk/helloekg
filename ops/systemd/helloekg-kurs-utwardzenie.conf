# /etc/systemd/system/helloekg-kurs.service.d/utwardzenie.conf (od 10.11.2026, przed testem bezpieczeństwa)
# Kurs nie widzi katalogów studia ani domowych, nie ma uprawnień jądra ani urządzeń.
[Service]
ProtectHome=true
# od audytu 10.11 także kopie zapasowe (studia i kursu), konfiguracja Caddy i inna aplikacja na serwerze
InaccessiblePaths=-/var/lib/helloekg-studio -/etc/helloekg-studio.env -/opt/helloekg-studio -/var/backups -/opt/mission-control -/etc/caddy
# pamięć: limit na wypadek zalewu dużych żądań (audyt 10.11)
MemoryHigh=768M
MemoryMax=1G
PrivateDevices=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
ProtectClock=true
ProtectHostname=true
RestrictSUIDSGID=true
RestrictRealtime=true
RestrictNamespaces=true
LockPersonality=true
SystemCallArchitectures=native
CapabilityBoundingSet=
AmbientCapabilities=
UMask=0027
