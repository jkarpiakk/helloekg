# /etc/systemd/system/helloekg-kurs.service.d/utwardzenie.conf (od 10.11.2026, przed testem bezpieczeństwa)
# Kurs nie widzi katalogów studia ani domowych, nie ma uprawnień jądra ani urządzeń.
[Service]
ProtectHome=true
InaccessiblePaths=-/var/lib/helloekg-studio -/etc/helloekg-studio.env -/opt/helloekg-studio
PrivateDevices=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
ProtectClock=true
ProtectHostname=true
RestrictSUIDSGID=true
RestrictRealtime=true
RestrictNamespaces=true
LockPersonality=true
SystemCallArchitectures=native
CapabilityBoundingSet=
AmbientCapabilities=
UMask=0027
